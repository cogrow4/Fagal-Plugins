<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fagal Boost</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#12171e; --edge:#232a34;
    --accent:#7ee0c2; --accent2:#3f9a85; --accent3:#ffd24a; --accent4:#ff6b6b;
    --text:#e6edf3; --muted:#8b97a7; --track:#222a35;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:radial-gradient(150% 120% at 50% -10%,#152420 0%,var(--bg) 60%);
    color:var(--text);overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;padding:18px 22px 14px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;flex-direction:column;gap:3px}
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--accent)}
  .wordmark .sep{color:var(--muted);margin:0 .25em}
  .product{font-size:22px;font-weight:600;letter-spacing:.06em}
  .product span{color:var(--accent)}
  .badge{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;text-align:right;line-height:1.6}

  /* main grid */
  main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:14px;min-height:0}

  /* VU + peak visualizer */
  .viz{position:relative;border:1px solid var(--edge);border-radius:14px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    overflow:hidden;display:flex;flex-direction:column}
  .viz canvas{display:block;width:100%;flex:1}
  .vlabel{position:absolute;top:10px;left:14px;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .vreadout{position:absolute;bottom:10px;left:14px;right:14px;display:flex;
    justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--accent2);
    text-transform:uppercase;font-variant-numeric:tabular-nums}

  /* right column: sections */
  .right{display:grid;grid-template-rows:1fr auto;gap:14px;min-height:0}
  .section{border:1px solid var(--edge);border-radius:14px;background:var(--panel);
    padding:12px 14px 10px;display:flex;flex-direction:column}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sec-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .knobs{flex:1;display:flex;align-items:center;justify-content:space-around;gap:4px}

  /* toggles row */
  .toggles{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-around}
  .tog{display:flex;flex-direction:column;align-items:center;gap:6px}
  .sw{width:50px;height:24px;border-radius:13px;background:var(--track);
    border:1px solid var(--edge);position:relative;cursor:pointer;transition:.18s}
  .sw .nub{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#3a424e;transition:.18s;box-shadow:0 2px 5px rgba(0,0,0,.5)}
  .sw.on{background:var(--accent2);border-color:var(--accent)}
  .sw.on .nub{left:28px;background:var(--accent);box-shadow:0 0 10px rgba(126,224,194,.55)}
  .sw.on.byp .nub{background:var(--accent4);box-shadow:0 0 10px rgba(255,107,107,.55)}
  .tog .lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* knob */
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .knob{position:relative;width:62px;height:62px;cursor:ns-resize;touch-action:none}
  .knob svg{display:block;overflow:visible}
  .knob .cap{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
  .label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .val{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text);
    background:var(--panel2);border:1px solid var(--edge);border-radius:6px;
    padding:2px 7px;min-width:50px;text-align:center}

  footer{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
  .hint{font-size:10px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);display:inline-block;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="wordmark">FAGAL<span class="sep">·</span>PLUGINS</div>
      <div class="product">Fagal <span>Boost</span></div>
    </div>
    <div class="badge">utility · mastering grade<br/>trim · gain · m/s · ceiling</div>
  </header>

  <main>
    <div class="viz">
      <span class="vlabel">Stereo VU · Peak Meter</span>
      <canvas id="cv"></canvas>
      <div class="vreadout">
        <span id="st-l">L — ∞ dB</span>
        <span id="st-r">R — ∞ dB</span>
        <span id="st-g">GAIN +0.0 dB</span>
      </div>
    </div>

    <div class="right">
      <div class="section">
        <div class="sec-head"><div class="sec-title">Signal · Gain</div></div>
        <div class="knobs" id="knobsMain"></div>
      </div>
      <div class="section">
        <div class="sec-head"><div class="sec-title">Routing · Toggles</div></div>
        <div class="toggles" id="toggles"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="hint"><span class="dot"></span>drag knob vertically · double-click to reset · click toggles</div>
    <div class="badge">Fagal Boost v2.0</div>
  </footer>
</div>

<script>
const casc = window.casc || (window.casc = (()=>{
  const state={};
  return {
    _subs:[],
    _onMeter:null,
    setParam(id,v){state[id]=v;},
    getParam(id){return (id in state)?state[id]:PARAMS_BY_ID[id].def;},
    subscribe(cb){this._subs.push(cb);},
    getMeter(_n){ /* no-op in browser-only mode */ },
    onMeter(cb){this._onMeter=cb;}
  };
})());

function fmtDb(v){const db=(v-0.5)*48;return (db>=0?"+":"")+db.toFixed(1)+" dB";}

const PARAMS = [
  {id:0,label:"In Trim",   def:0.75,fmt:fmtDb},
  {id:1,label:"Gain",      def:0.62,fmt:fmtDb},
  {id:2,label:"Out Trim",  def:0.75,fmt:fmtDb},
  {id:3,label:"Mid/Side",  def:0.50,fmt:v=>Math.round((v*2-1)*100)+"%"},
  {id:4,label:"Ceiling",   def:0.95,fmt:v=>Math.round((0.7+v*0.3)*100)+"%"},
];
const PARAMS_BY_ID={}; PARAMS.forEach(p=>PARAMS_BY_ID[p.id]=p);
[5,6,7,8].forEach(id=>PARAMS_BY_ID[id]={id,def:id===5?1.0:0.0});

const live={};
PARAMS.forEach(p=>live[p.id]=casc.getParam(p.id));
[5,6,7,8].forEach(id=>live[id]=casc.getParam(id));

/* ---- knob factory ---- */
const ARC_START=-135, ARC_END=135;
function knobSVG(){
  return `<svg width="62" height="62" viewBox="0 0 86 86">
    <circle cx="43" cy="43" r="36" fill="none" stroke="var(--track)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="170 400" transform="rotate(135 43 43)"/>
    <circle class="arc" cx="43" cy="43" r="36" fill="none" stroke="var(--accent)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="0 400" transform="rotate(135 43 43)"/>
    <g class="cap">
      <circle cx="43" cy="43" r="27" fill="var(--panel2)" stroke="var(--edge)" stroke-width="1.5"/>
      <line class="ind" x1="43" y1="43" x2="43" y2="22" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>`;
}
function makeKnob(p){
  const cell=document.createElement("div");cell.className="cell";
  const knob=document.createElement("div");knob.className="knob";knob.innerHTML=knobSVG();
  const label=document.createElement("div");label.className="label";label.textContent=p.label;
  const val=document.createElement("div");val.className="val";
  cell.append(knob,label,val);
  let value=casc.getParam(p.id);
  const arc=knob.querySelector(".arc"), ind=knob.querySelector(".ind");
  const CIRC=2*Math.PI*36;
  function render(){
    const ang=ARC_START+(ARC_END-ARC_START)*value;
    ind.setAttribute("transform",`rotate(${ang} 43 43)`);
    arc.setAttribute("stroke-dasharray",`${value*(270/360)*CIRC} 400`);
    val.textContent=p.fmt(value);
  }
  function set(v,push){
    value=Math.max(0,Math.min(1,v));live[p.id]=value;render();
    if(push)casc.setParam(p.id,value);
  }
  render();
  let dragging=false,lastY=0;
  knob.addEventListener("pointerdown",e=>{dragging=true;lastY=e.clientY;knob.setPointerCapture(e.pointerId);});
  knob.addEventListener("pointermove",e=>{if(!dragging)return;const dy=lastY-e.clientY;lastY=e.clientY;set(value+dy*0.005,true);});
  knob.addEventListener("pointerup",()=>dragging=false);
  knob.addEventListener("dblclick",()=>set(p.def,true));
  casc.subscribe((id,v)=>{if(id===p.id)set(v,false);});
  return cell;
}
PARAMS.forEach(p=>document.getElementById("knobsMain").appendChild(makeKnob(p)));

/* ---- toggles ---- */
const TOGDEFS = [
  {id:5, label:"Link"},
  {id:6, label:"Φ L"},
  {id:7, label:"Φ R"},
  {id:8, label:"Bypass", classN:"byp"},
];
const togHost=document.getElementById("toggles");
function makeTog(d){
  const wrap=document.createElement("div");wrap.className="tog";
  const sw=document.createElement("div");sw.className="sw"+(d.classN?(" "+d.classN):"");
  sw.innerHTML='<div class="nub"></div>';
  const lab=document.createElement("div");lab.className="lab";lab.textContent=d.label;
  wrap.append(sw,lab);
  let on=casc.getParam(d.id)>=0.5; live[d.id]=on?1:0;
  function render(){sw.classList.toggle("on",on);}
  function set(v,push){on=v;render();if(push)casc.setParam(d.id,on?1:0); live[d.id]=on?1:0;}
  render();
  sw.addEventListener("click",()=>set(!on,true));
  casc.subscribe((id,v)=>{if(id===d.id)set(v>=0.5,false);});
  return wrap;
}
TOGDEFS.forEach(d=>togHost.appendChild(makeTog(d)));

/* ---- live VU + peak visualizer ---- */
const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
function fit(){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(fit).observe(cv);fit();

/* Real meters driven by casc._latestMeter, pushed by the host on each UI tick */
let lastT=performance.now();
let levelL=0, levelR=0, peakHoldL=0, peakHoldR=0, peakHoldTimeL=0, peakHoldTimeR=0;
let tgtL = -80, tgtR = -80;
let lastMeterLen = 0;
if (casc.onMeterFrame) casc.onMeterFrame((arr) => {
  if (!arr || arr.length < 2) return;
  lastMeterLen = arr.length;
  let mxL = 0, mxR = 0;
  for (let i = 0; i < arr.length; i += 2) {
    const a = arr[i]   < 0 ? -arr[i]   : arr[i];
    const b = arr[i+1] < 0 ? -arr[i+1] : arr[i+1];
    if (a > mxL) mxL = a;
    if (b > mxR) mxR = b;
  }
  if (mxL > 0) mxL = 20 * Math.log10(mxL); else mxL = -80;
  if (mxR > 0) mxR = 20 * Math.log10(mxR); else mxR = -80;
  tgtL = mxL; tgtR = mxR;
  if (tgtL > peakHoldL) { peakHoldL = tgtL; peakHoldTimeL = performance.now(); }
  if (tgtR > peakHoldR) { peakHoldR = tgtR; peakHoldTimeR = performance.now(); }
});
const vuRel = 0.18;
function draw(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);

  const gnDb=(live[1]-0.5)*48;
  const inDb=(live[0]-0.5)*48;
  const outDb=(live[2]-0.5)*48;
  const totalDb=inDb+gnDb+outDb;

  /* VU ballistics (level uses slow release on top of target) */
  const vuAtk=0.6*dt;
  levelL += tgtL>levelL ? vuAtk*(tgtL-levelL) : vuRel*dt*30*(tgtL-levelL);
  levelR += tgtR>levelR ? vuAtk*(tgtR-levelR) : vuRel*dt*30*(tgtR-levelR);
  /* peak: fast attack, slow release, hold then drop */
  const pkRel=0.4*dt;
  if (now-peakHoldTimeL>1500) peakHoldL += pkRel*(-1.5 - peakHoldL);
  if (now-peakHoldTimeR>1500) peakHoldR += pkRel*(-1.5 - peakHoldR);

  const audText = lastMeterLen > 0 ? "INPUT/OUTPUT" : "no signal";

  /* dB scale: -40 .. +6 */
  const dbMin=-40, dbMax=+6;
  function xOfDb(d){ return (d - dbMin) / (dbMax - dbMin) * W; }

  /* background gradient */
  const grad=ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,   "rgba(126,224,194,0.10)");
  grad.addColorStop(0.55,"rgba(255,210,74,0.15)");
  grad.addColorStop(0.85,"rgba(255,107,107,0.20)");
  grad.addColorStop(1,   "rgba(255,107,107,0.30)");
  ctx.fillStyle=grad;
  ctx.fillRect(0, H*0.30, W, H*0.40);

  /* dB grid + labels */
  ctx.strokeStyle="rgba(255,255,255,0.06)";ctx.lineWidth=1;
  ctx.fillStyle="rgba(255,255,255,0.25)";
  ctx.font="9px -apple-system,sans-serif";
  for (let db=-40; db<=+6; db+=6){
    const x=xOfDb(db);
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    if (db!==0) ctx.fillText(db.toString(), x+2, H*0.30 - 2);
    else        ctx.fillText("0", x-3, H*0.30 - 2);
  }

  /* two bar rows: L (upper half), R (lower half) */
  const barH = (H*0.40) - 4;
  function drawBar(rowY, level, peak, color){
    const w = Math.max(0, xOfDb(level) - xOfDb(dbMin));
    const px = xOfDb(dbMin);
    ctx.fillStyle = color;
    ctx.fillRect(px, rowY, w, barH);
    /* peak tick */
    const pxPeak = xOfDb(peak);
    ctx.fillStyle="rgba(255,255,255,0.95)";
    ctx.fillRect(pxPeak-1.5, rowY-1, 3, barH+2);
  }
  drawBar(H*0.32, levelL, peakHoldL, "rgba(126,224,194,0.85)");
  drawBar(H*0.72, levelR, peakHoldR, "rgba(159,240,232,0.85)");

  /* channel labels */
  ctx.fillStyle="rgba(255,255,255,0.4)";ctx.font="600 10px -apple-system,sans-serif";
  ctx.fillText("L", 4, H*0.32 + barH*0.6);
  ctx.fillText("R", 4, H*0.72 + barH*0.6);

  /* stats */
  const fmt=(v)=>v<=-39.5?"— ∞ dB":(v>=0?"+":"")+v.toFixed(1)+" dB";
  document.getElementById("st-l").textContent="L "+fmt(levelL);
  document.getElementById("st-r").textContent="R "+fmt(levelR);
  document.getElementById("st-g").textContent="GAIN "+(totalDb>=0?"+":"")+totalDb.toFixed(1)+" dB";

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
