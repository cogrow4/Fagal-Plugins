<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fagal Drive</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#12171e; --edge:#232a34;
    --accent:#ff6b4a; --accent2:#b3492f; --accent3:#ffb04a;
    --text:#e6edf3; --muted:#8b97a7; --track:#222a35;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:radial-gradient(150% 120% at 50% -10%,#1f1a23 0%,var(--bg) 60%);
    color:var(--text);overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;padding:18px 22px 14px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .brand{display:flex;flex-direction:column;gap:3px}
  .wordmark{font-size:13px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--accent)}
  .wordmark .sep{color:var(--muted);margin:0 .25em}
  .product{font-size:22px;font-weight:600;letter-spacing:.06em}
  .product span{color:var(--accent)}
  .badge{font-size:10px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;text-align:right;line-height:1.6}

  /* main grid */
  main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:14px;min-height:0}

  /* transfer-curve visualizer (left) */
  .viz{position:relative;border:1px solid var(--edge);border-radius:14px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    overflow:hidden}
  .viz canvas{display:block;width:100%;height:100%}
  .viz .vtag{position:absolute;top:10px;left:14px;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .viz .vmode{position:absolute;top:10px;right:14px;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:600}
  .viz .vstats{position:absolute;bottom:10px;left:14px;right:14px;display:flex;
    justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--accent2);
    text-transform:uppercase;font-variant-numeric:tabular-nums}

  /* right column: sections */
  .right{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0}
  .section{border:1px solid var(--edge);border-radius:14px;background:var(--panel);
    padding:12px 14px 10px;display:flex;flex-direction:column}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sec-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .knobs{flex:1;display:flex;align-items:center;justify-content:space-around;gap:4px}

  /* mode selector pills */
  .modesel{display:flex;gap:4px}
  .modesel button{background:var(--panel2);border:1px solid var(--edge);color:var(--muted);
    font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 7px;border-radius:7px;
    cursor:pointer;transition:.15s;font-weight:600}
  .modesel button.on{background:linear-gradient(180deg,var(--accent2),#7d2e1d);
    color:#fff;border-color:var(--accent);box-shadow:0 0 12px rgba(255,107,74,.35)}

  /* knob */
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .knob{position:relative;width:62px;height:62px;cursor:ns-resize;touch-action:none}
  .knob svg{display:block;overflow:visible}
  .knob .cap{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
  .label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .val{font-size:11px;font-variant-numeric:tabular-nums;color:var(--text);
    background:var(--panel2);border:1px solid var(--edge);border-radius:6px;
    padding:2px 7px;min-width:50px;text-align:center}

  footer{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
  .hint{font-size:10px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent);display:inline-block;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="wordmark">FAGAL<span class="sep">·</span>PLUGINS</div>
      <div class="product">Fagal <span>Drive</span></div>
    </div>
    <div class="badge">waveshaper · 5 modes<br/>tube · tape · soft · hard · fold</div>
  </header>

  <main>
    <div class="viz">
      <span class="vtag">Transfer · pre / post</span>
      <span class="vmode" id="vmode">TUBE</span>
      <canvas id="cv"></canvas>
      <div class="vstats">
        <span id="st-drive">DRIVE 45%</span>
        <span id="st-mix">MIX 100%</span>
        <span id="st-ceil">CEIL 95%</span>
      </div>
    </div>

    <div class="right">
      <div class="section">
        <div class="sec-head">
          <div class="sec-title">Curve</div>
          <div class="modesel" id="modesel">
            <button data-m="0">Tube</button>
            <button data-m="1">Tape</button>
            <button data-m="2">Soft</button>
            <button data-m="3">Hard</button>
            <button data-m="4">Fold</button>
          </div>
        </div>
        <div class="knobs" id="knobsCurve"></div>
      </div>
      <div class="section">
        <div class="sec-head"><div class="sec-title">Tone · Dynamics · Output</div></div>
        <div class="knobs" id="knobsOut"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="hint"><span class="dot"></span>drag knob vertically · double-click to reset · click curve pills</div>
    <div class="badge">Fagal Drive v2.0</div>
  </footer>
</div>

<script>
/* ---- CASC UI <-> DSP bridge shim (forward-compat) ---- */
const casc = window.casc || (window.casc = (()=>{
  const state={};
  return {
    _subs:[],
    setParam(id,v){state[id]=v;},
    getParam(id){return (id in state)?state[id]:PARAMS_BY_ID[id].def;},
    subscribe(cb){this._subs.push(cb);}
  };
})());

/* (id, label, section, default, fmt) */
const PARAMS = [
  {id:0,label:"Drive",    sec:"curve",def:0.45,fmt:v=>Math.round(v*100)+"%"},
  {id:1,label:"Bias",     sec:"curve",def:0.50,fmt:v=>(v*2-1).toFixed(2)},
  {id:2,label:"Pre Tone", sec:"out",  def:0.65,fmt:v=>Math.round(v*100)+"%"},
  {id:3,label:"Post Tone",sec:"out",  def:0.60,fmt:v=>Math.round(v*100)+"%"},
  {id:4,label:"Dynamics", sec:"out",  def:0.0, fmt:v=>Math.round(v*100)+"%"},
  {id:5,label:"Ceiling",  sec:"out",  def:0.95,fmt:v=>Math.round((0.7+v*0.3)*100)+"%"},
  {id:7,label:"Output",   sec:"out",  def:0.8, fmt:v=>Math.round(v*100)+"%"},
  {id:8,label:"Mix",      sec:"out",  def:1.0, fmt:v=>Math.round(v*100)+"%"},
];
const PARAMS_BY_ID={}; PARAMS.forEach(p=>PARAMS_BY_ID[p.id]=p);
PARAMS_BY_ID[6]={id:6,def:0.0};

const MODE_NAMES=["TUBE","TAPE","SOFT","HARD","FOLD"];
function modeIndex(v){return Math.max(0,Math.min(4,Math.round(v*4.999)));}
function getMode(){return modeIndex(casc.getParam(6));}

const live={};
PARAMS.forEach(p=>live[p.id]=casc.getParam(p.id));
live[6]=casc.getParam(6);

/* ---- knob factory ---- */
const ARC_START=-135, ARC_END=135;
function knobSVG(){
  return `<svg width="62" height="62" viewBox="0 0 86 86">
    <circle cx="43" cy="43" r="36" fill="none" stroke="var(--track)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="170 400" transform="rotate(135 43 43)"/>
    <circle class="arc" cx="43" cy="43" r="36" fill="none" stroke="var(--accent)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="0 400" transform="rotate(135 43 43)"/>
    <g class="cap">
      <circle cx="43" cy="43" r="27" fill="var(--panel2)" stroke="var(--edge)" stroke-width="1.5"/>
      <line class="ind" x1="43" y1="43" x2="43" y2="22" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>`;
}
function makeKnob(p){
  const cell=document.createElement("div");cell.className="cell";
  const knob=document.createElement("div");knob.className="knob";knob.innerHTML=knobSVG();
  const label=document.createElement("div");label.className="label";label.textContent=p.label;
  const val=document.createElement("div");val.className="val";
  cell.append(knob,label,val);
  let value=casc.getParam(p.id);
  const arc=knob.querySelector(".arc"), ind=knob.querySelector(".ind");
  const CIRC=2*Math.PI*36;
  function render(){
    const ang=ARC_START+(ARC_END-ARC_START)*value;
    ind.setAttribute("transform",`rotate(${ang} 43 43)`);
    arc.setAttribute("stroke-dasharray",`${value*(270/360)*CIRC} 400`);
    val.textContent=p.fmt(value);
  }
  function set(v,push){
    value=Math.max(0,Math.min(1,v));live[p.id]=value;render();
    if(push)casc.setParam(p.id,value);
  }
  render();
  let dragging=false,lastY=0;
  knob.addEventListener("pointerdown",e=>{dragging=true;lastY=e.clientY;knob.setPointerCapture(e.pointerId);});
  knob.addEventListener("pointermove",e=>{if(!dragging)return;const dy=lastY-e.clientY;lastY=e.clientY;set(value+dy*0.005,true);});
  knob.addEventListener("pointerup",()=>dragging=false);
  knob.addEventListener("dblclick",()=>set(p.def,true));
  casc.subscribe((id,v)=>{if(id===p.id)set(v,false);});
  return cell;
}

document.getElementById("knobsCurve").appendChild(makeKnob(PARAMS[0]));
document.getElementById("knobsCurve").appendChild(makeKnob(PARAMS[1]));
PARAMS.slice(2).forEach(p=>document.getElementById("knobsOut").appendChild(makeKnob(p)));

/* ---- mode pills ---- */
const modesel=document.getElementById("modesel");
const vmode=document.getElementById("vmode");
function syncMode(){
  const m=getMode();
  vmode.textContent=MODE_NAMES[m];
  [...modesel.children].forEach(b=>b.classList.toggle("on",+b.dataset.m===m));
}
[...modesel.children].forEach(b=>{
  b.addEventListener("click",()=>{
    const m=+b.dataset.m;live[6]=m/4;casc.setParam(6,m/4);syncMode();
  });
});
casc.subscribe((id,v)=>{if(id===6){live[6]=v;syncMode();}});
syncMode();

/* ---- live transfer-curve visualizer ---- */
const cv=document.getElementById("cv");
const ctx=cv.getContext("2d");
function fit(){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(fit).observe(cv);fit();

/* DSP shaper mirror for visualization. Matches the C code in shape only;
 * the UI runs in real-time at animation frame-rate so the curve is a hint,
 * not an authoritative copy. */
function shapeDSP(mode,x){
  const tanh=x=>{const X=Math.max(-8,Math.min(8,x));const x2=X*X;return X*(27+x2)/(27+9*x2);};
  switch(mode){
    case 0: return tanh((x + 0.12*x*x*x) * 1.05);
    case 1: return tanh(x*0.9) + 0.05*x*x*(x<0?-1:1);
    case 2: return tanh(x);
    case 3: if(x>1) return 1; if(x<-1) return -1; if(x>0.3333) return 1; if(x<-0.3333) return -1; return 3*x;
    case 4: { let y=x; while(y>1)y=2-y; while(y<-1)y=-2-y; return tanh(y*1.2); }
  }
  return x;
}

let lfoPhase=0,lastT=performance.now();
function draw(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);

  const drive=0.5+live[0]*59.5;
  const bias =(live[1]-0.5);
  const mode=getMode();

  /* axes */
  ctx.strokeStyle="rgba(255,255,255,0.06)";ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);
  ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);
  ctx.stroke();

  /* the curve: x in [-1.5..+1.5] -> y = soft_ceiling(shaper((x+bias)*drive), ceilMag) * outg */
  const ceilMag=0.7+live[5]*0.3;
  const outg=live[7];
  const x0=-1.5, x1=+1.5;

  /* identity reference line */
  ctx.strokeStyle="rgba(255,255,255,0.10)";ctx.lineWidth=1;
  ctx.beginPath();
  for(let px=0;px<=W;px++){
    const x=x0+(px/W)*(x1-x0);
    const py=H/2 - x*((H/2)/1.5);
    if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();

  /* the actual curve */
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"rgba(255,176,74,0.95)");
  grad.addColorStop(1,"rgba(255,107,74,0.95)");
  ctx.strokeStyle=grad;ctx.lineWidth=2.4;
  ctx.beginPath();
  for(let px=0;px<=W;px++){
    const x=x0+(px/W)*(x1-x0);
    let y=shapeDSP(mode,(x+bias)*drive);
    /* soft ceiling mirror */
    const c=Math.max(0.001,ceilMag);
    y = c * Math.tanh(y/c);
    y *= outg;
    const py=H/2 - Math.max(-1.5,Math.min(1.5,y))*((H/2)/1.5);
    if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.stroke();

  /* drive-region highlight: where the curve deviates from linear */
  ctx.fillStyle="rgba(255,107,74,0.10)";
  ctx.beginPath();
  ctx.moveTo(W/2,H/2);
  for(let px=0;px<=W;px++){
    const x=x0+(px/W)*(x1-x0);
    let y=shapeDSP(mode,(x+bias)*drive);
    const c=Math.max(0.001,ceilMag);
    y = c * Math.tanh(y/c) * outg;
    const py=H/2 - Math.max(-1.5,Math.min(1.5,y))*((H/2)/1.5);
    ctx.lineTo(px,py);
  }
  ctx.lineTo(W/2,H/2);
  ctx.closePath();
  ctx.fill();

  /* stats */
  document.getElementById("st-drive").textContent="DRIVE "+Math.round(live[0]*100)+"%";
  document.getElementById("st-mix").textContent="MIX "+Math.round(live[8]*100)+"%";
  document.getElementById("st-ceil").textContent="CEIL "+Math.round(ceilMag*100)+"%";

  /* a slow pulse to feel "live" */
  lfoPhase+=dt*1.6;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
